<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIPENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 400px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: none;
    }
    .login-header {
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      border-radius: 16px 16px 0 0;
      padding: 30px;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-weight: 700;
      letter-spacing: 2px;
    }
    .login-header p {
      font-size: 13px;
      opacity: 0.85;
      margin: 0;
    }
    .login-body {
      padding: 35px;
    }
    .form-control {
      border-radius: 8px;
      padding: 12px 15px;
      border: 1px solid #ddd;
      font-size: 14px;
    }
    .form-control:focus {
      border-color: #9b59b6;
      box-shadow: 0 0 0 3px rgba(155,89,182,0.15);
    }
    .input-group-text {
      background: white;
      border-right: none;
      color: #9b59b6;
    }
    .input-group .form-control {
      border-left: none;
    }
    .btn-login {
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1px;
      color: white;
      width: 100%;
      transition: opacity 0.3s;
    }
    .btn-login:hover {
      opacity: 0.9;
      color: white;
    }
    .alert {
      border-radius: 8px;
      font-size: 13px;
    }
    .logo-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="logo-icon">🏢</div>
      <h2>SIPENA</h2>
      <p>Sistem Informasi Kepegawaian</p>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- Pesan error -->
      <div id="errorMsg" class="alert alert-danger d-none">
        <i class="bi bi-exclamation-circle me-2"></i>
        NIP atau Password salah!
      </div>

      <!-- Form -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-muted" style="font-size:13px;">
          Nomor Induk Pegawai (NIP)
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person-badge"></i>
          </span>
          <input type="text" id="nip" class="form-control"
            placeholder="Masukkan NIP" required autocomplete="off">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold text-muted" style="font-size:13px;">
          Password
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" class="form-control"
            placeholder="Masukkan Password" required>
          <span class="input-group-text" style="cursor:pointer" onclick="togglePassword()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </span>
        </div>
      </div>

      <button class="btn btn-login" onclick="doLogin()">
        <i class="bi bi-box-arrow-in-right me-2"></i>MASUK
      </button>

      <p class="text-center text-muted mt-3" style="font-size:12px;">
        © 2026 SIPENA - Sistem Kepegawaian
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle show/hide password
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // Login pakai fetch ke Node.js
    async function doLogin() {
      const nip = document.getElementById('nip').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nip, password })
      });

      if (response.redirected) {
        window.location.href = response.url;
      } else {
        const data = await response.json();
        document.getElementById('errorMsg').classList.remove('d-none');
      }
    }

    // Enter key untuk login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
