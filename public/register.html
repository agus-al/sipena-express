<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SIPENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 400px;
      border-radius: 16px;
      border: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .card-header {
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      border-radius: 16px 16px 0 0;
      padding: 30px;
      text-align: center;
      color: white;
    }
    .form-control {
      border-radius: 8px;
      padding: 12px 15px;
    }
    .form-control:focus {
      border-color: #9b59b6;
      box-shadow: 0 0 0 3px rgba(155,89,182,0.15);
    }
    .input-group-text {
      background: white;
      border-right: none;
      color: #9b59b6;
    }
    .input-group .form-control {
      border-left: none;
    }
    .btn-register {
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      color: white;
      width: 100%;
    }
    .btn-register:hover {
      opacity: 0.9;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="card-header">
      <div style="font-size:48px">🏢</div>
      <h2 class="fw-bold" style="letter-spacing:2px">SIPENA</h2>
      <p style="font-size:13px; opacity:0.85; margin:0">Daftar Akun Baru</p>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <!-- Error -->
      <div id="errorMsg" class="alert alert-danger d-none">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span id="errorText">Terjadi kesalahan!</span>
      </div>

      <!-- NIP -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-muted" style="font-size:13px">
          Nomor Induk Pegawai (NIP)
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person-badge"></i>
          </span>
          <input type="text" id="nip" class="form-control"
            placeholder="Masukkan NIP" required>
        </div>
      </div>


      <!-- Password -->
      <div class="mb-4">
        <label class="form-label fw-semibold text-muted" style="font-size:13px">
          Password
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" class="form-control"
            placeholder="Masukkan Password" required>
          <span class="input-group-text" style="cursor:pointer"
            onclick="togglePassword()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </span>
        </div>
      </div>

      <button class="btn btn-register" onclick="doRegister()">
        <i class="bi bi-person-plus me-2"></i>DAFTAR
      </button>

      <p class="text-center mt-3" style="font-size:13px">
        Sudah punya akun?
        <a href="/auth/login" style="color:#9b59b6">Login di sini</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    async function doRegister() {
      const nip = document.getElementById('nip').value;
          const password = document.getElementById('password').value;

      if (!nip || !password) {
        document.getElementById('errorText').innerText = 'Semua field wajib diisi!';
        document.getElementById('errorMsg').classList.remove('d-none');
        return;
      }

      const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nip, password })
      });

      if (response.redirected) {
        window.location.href = response.url;
      } else {
        const data = await response.json();
        document.getElementById('errorText').innerText = data.message;
        document.getElementById('errorMsg').classList.remove('d-none');
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
